<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>広島市 保育園空きマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #d9e2ec;
    --accent: #2563eb;
    --none: #9aa5b1;
    --few: #f59e0b;
    --many: #16a34a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  /* 上部は「タイトル1行＋操作1行」に収めて、地図の面積を最大にする */
  header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    z-index: 1000;
  }
  .title { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  h1 { font-size: 16px; margin: 0; }
  .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .ages {
    display: flex;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ages::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .ages .chip { flex: 1; max-width: 64px; padding: 6px 0; }
  .chip.icon { padding: 6px 9px; }
  /* 地図の右上に重ねるボタン */
  .map-buttons { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .map-buttons .chip { box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 13px; }

  /* 凡例と注意書きは地図の左下に重ねる */
  .legend-box {
    background: rgba(255,255,255,.92);
    border-radius: 8px;
    padding: 6px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
    font-size: 11px;
    color: var(--muted);
    max-width: 260px;
    line-height: 1.5;
  }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--text); font-size: 12px; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: -1px;
    background: var(--c);
  }
  #map { flex: 1; min-height: 0; }
  .leaflet-tile-pane { filter: grayscale(1) contrast(0.6) brightness(1.2); }

  .pin {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif;
  }
  /* 空きなし・対象年齢外は小さな点にして、空きのある園を目立たせる。
     点そのものは小さいが、指で押せるよう周りに透明な押せる範囲を取る */
  .dot-hit { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .dot { border-radius: 50%; }
  .dot.zero { width: 12px; height: 12px; background: var(--none); border: 2px solid #fff; opacity: .8; box-shadow: 0 0 2px rgba(0,0,0,.3); }
  .dot.na { width: 9px; height: 9px; border: 2px solid var(--none); background: #fff; opacity: .6; }
  .legend span.small::before { width: 8px; height: 8px; vertical-align: 0; }
  .legend span.ring::before { width: 6px; height: 6px; background: #fff; border: 2px solid var(--none); vertical-align: 0; }

  .popup h2 { font-size: 15px; margin: 0 0 2px; }
  .popup .type { font-size: 12px; color: var(--muted); }
  .popup table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .popup th, .popup td { border: 1px solid var(--border); padding: 3px 7px; text-align: center; }
  .popup th { background: #f5f7fa; font-weight: 600; }
  .popup td.sel, .popup th.sel { background: #dbeafe; font-weight: 700; }
  .popup .info { font-size: 12px; line-height: 1.6; }
  .popup .note { font-size: 12px; color: #b45309; margin-top: 4px; }

  [hidden] { display: none !important; }
  .map-wrap { flex: 1; min-height: 0; position: relative; }
  .map-wrap #map { position: absolute; inset: 0; }

  /* 絞り込み・検索のパネル（地図の上に重ねる） */
  .panel {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    max-width: 420px;
    max-height: calc(100% - 16px);
    overflow-y: auto;
    z-index: 1100;
    background: var(--bg);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
  .panel input[type="search"] {
    width: 100%;
    font-size: 16px; /* 16px未満だとiPhoneで入力時に画面が拡大される */
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips .chip { font-size: 13px; padding: 6px 10px; }
  .results { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; }
  .results li + li { border-top: 1px solid var(--border); }
  .results button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 8px 10px; font: inherit; color: var(--text);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .results button:hover { background: #f5f7fa; }
  .results .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .results .empty { padding: 8px 10px; color: var(--muted); font-size: 13px; }
  .panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .panel-foot .count { font-size: 13px; color: var(--muted); }
  .panel-foot .actions { display: flex; gap: 6px; }
  .chip.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>広島市 保育園空きマップ</h1>
    <span class="sub" id="dataInfo">試作</span>
  </div>
  <div class="controls">
    <div class="ages" role="group" aria-label="年齢"></div>
  </div>
</header>
<div class="map-wrap">
  <div id="map"></div>
  <div class="panel" id="panel" hidden>
    <div>
      <h3><label for="q">施設名で探す</label></h3>
      <input type="search" id="q" placeholder="例：中島、りらっくす" autocomplete="off">
    </div>
    <ul class="results" id="results" hidden></ul>
    <div>
      <h3>区</h3>
      <div class="chips" id="wardChips"></div>
    </div>
    <div>
      <h3>種類</h3>
      <div class="chips" id="typeChips"></div>
    </div>
    <div class="panel-foot">
      <span class="count" id="count"></span>
      <span class="actions">
        <button class="chip" id="reset">条件をクリア</button>
        <button class="chip primary" id="closePanel">地図を見る</button>
      </span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
const AGES = [0, 1, 2, 3, 4, 5];
let age = 0;
let onlyOpen = false;

const map = L.map("map", { zoomSnap: 0.5 }).setView([34.385, 132.455], 14);
// 背景地図は国土地理院の淡色地図。ファイルを直接開いても表示でき、登録も不要。
// 記号が多いので白黒・淡色にしてピンを目立たせる（CSSの .leaflet-tile-pane）
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
}).addTo(map);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend-box");
  div.innerHTML = `<div class="legend">
      <span style="--c:var(--many)">3人以上</span>
      <span style="--c:var(--few)">1〜2人</span>
      <span class="small" style="--c:var(--none)">空きなし</span>
      <span class="ring">対象年齢外</span>
    </div>
    空きがあっても入園できるとは限りません。出典：広島市「保育園等の空き状況」`;
  return div;
};
legend.addTo(map);

const buttons = L.control({ position: "topright" });
buttons.onAdd = () => {
  const div = L.DomUtil.create("div", "map-buttons");
  div.innerHTML = `<button class="chip" id="openPanel">🔍 絞り込み・検索</button>
    <button class="chip" id="onlyOpen" aria-pressed="false">空きありのみ</button>
    <button class="chip icon" id="locate" aria-label="現在地">📍 現在地</button>`;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
buttons.addTo(map);

const layer = L.layerGroup().addTo(map);

function color(n) {
  if (n >= 3) return "var(--many)";
  if (n >= 1) return "var(--few)";
  return "var(--none)";
}

// 年齢によって保育する場所が違う施設は、選んでいる年齢の場所にピンを立てる
function site(f) {
  return f.over3 && age >= 3 ? f.over3 : f;
}

function popupHtml(f) {
  const head = AGES.map(a => `<th class="${a === age ? "sel" : ""}">${a}歳</th>`).join("");
  const row = (arr) => AGES.map(a => {
    const v = arr[a];
    return `<td class="${a === age ? "sel" : ""}">${v === null ? "－" : v}</td>`;
  }).join("");
  return `<div class="popup">
    <h2>${f.name}</h2>
    <div class="type">${f.type}</div>
    <table>
      <tr><th></th>${head}</tr>
      <tr><th>空き</th>${row(f.vacancy)}</tr>
      <tr><th>待機</th>${row(f.waiting)}</tr>
    </table>
    <div class="info">
      ${f.over3
        ? `📍 0〜2歳：${f.address}<br>📍 3〜5歳：${f.over3.address}<br>`
        : `📍 ${f.address}<br>`}
      📞 <a href="tel:${f.tel}">${f.tel}</a><br>
      🕖 ${f.hours}${f.extended ? `（延長 ${f.extended}）` : ""}<br>
      👶 定員 ${f.capacity}人
    </div>
    ${f.note ? `<div class="note">※${f.note}</div>` : ""}
    ${site(f).approx ? `<div class="note">※地図上の位置はおおよそです（住所の番地まで特定できないため）</div>` : ""}
  </div>`;
}

// 絞り込みの条件。区・種類は何も選んでいなければ「すべて」
const WARD_ORDER = ["中区", "東区", "南区", "西区", "安佐南区", "安佐北区", "安芸区", "佐伯区"];
const TYPE_ORDER = ["保育園", "認定こども園", "小規模保育", "事業所内保育"];
const wardSel = new Set();
const typeSel = new Set();
let query = "";

// 検索用に表記をそろえる（全角半角・大文字小文字・空白・カタカナとひらがな）
function fold(s) {
  return s.normalize("NFKC").toLowerCase().replace(/\s/g, "")
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
const FOLDED = new Map(window.FACILITIES.map(f => [f, fold(f.name)]));

function matchesFilter(f) {
  if (wardSel.size && !wardSel.has(f.ward)) return false;
  if (typeSel.size && !typeSel.has(f.type)) return false;
  if (query && !FOLDED.get(f).includes(fold(query))) return false;
  return true;
}

const markers = new Map();  // 施設 → ピン（検索結果から開くため）

function render() {
  layer.clearLayers();
  markers.clear();
  for (const f of window.FACILITIES) {
    const n = f.vacancy[age];
    if (!matchesFilter(f)) continue;
    if (onlyOpen && !(n > 0)) continue;
    const open = n > 0;
    const icon = open
      ? L.divIcon({
          className: "",
          html: `<div class="pin" style="background:${color(n)}">${n}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17],
        })
      : L.divIcon({
          className: "",
          // n === null はこの年齢の受け入れ対象外
          html: `<div class="dot-hit"><div class="dot ${n === null ? "na" : "zero"}"></div></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
        });
    // 空きのある園を常に手前に。空きが多いほど上に重ねる
    const z = open ? 1000 + n * 10 : n === null ? -1000 : 0;
    const m = L.marker([site(f).lat, site(f).lng], { icon, title: f.name, zIndexOffset: z })
      // 開いた詳細が右上のボタンに隠れないよう、上側に余白を取って地図を動かす
      .bindPopup(popupHtml(f), { maxWidth: 320, autoPanPaddingTopLeft: [16, 130] })
      .addTo(layer);
    markers.set(f, m);
  }
  updatePanel();
}

// ---- 絞り込み・検索のパネル ----
const panel = document.getElementById("panel");
const qInput = document.getElementById("q");
const results = document.getElementById("results");

function makeChips(boxId, values, sel) {
  const box = document.getElementById(boxId);
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = v;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      sel.has(v) ? sel.delete(v) : sel.add(v);
      b.setAttribute("aria-pressed", sel.has(v));
      render();
    };
    box.appendChild(b);
  }
}
makeChips("wardChips", WARD_ORDER, wardSel);
makeChips("typeChips", TYPE_ORDER, typeSel);

function filterCount() {
  return wardSel.size + typeSel.size + (query ? 1 : 0);
}

function updatePanel() {
  const shown = window.FACILITIES.filter(matchesFilter);
  document.getElementById("count").textContent = `${shown.length}施設が当てはまります`;
  const n = filterCount();
  document.getElementById("openPanel").textContent = n ? `🔍 絞り込み中（${n}）` : "🔍 絞り込み・検索";
  document.getElementById("openPanel").setAttribute("aria-pressed", n > 0);

  // 名前を入れたときだけ、当てはまる施設の一覧を出す（押すとその施設へ移動）
  results.hidden = !query;
  results.replaceChildren();
  if (!query) return;
  if (!shown.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "見つかりません。名前の一部だけで探してみてください";
    results.appendChild(li);
    return;
  }
  for (const f of shown.slice(0, 30)) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    const name = document.createElement("span");
    name.textContent = f.name;
    const meta = document.createElement("span");
    meta.className = "meta";
    const v = f.vacancy[age];
    meta.textContent = `${f.ward}・${age}歳 ${v === null ? "対象外" : v > 0 ? `空き${v}` : "空きなし"}`;
    b.append(name, meta);
    b.onclick = () => showFacility(f);
    li.appendChild(b);
    results.appendChild(li);
  }
}

function showFacility(f) {
  if (!markers.has(f)) {  // 「空きありのみ」で隠れているときは解除して表示する
    onlyOpen = false;
    document.getElementById("onlyOpen").setAttribute("aria-pressed", false);
    render();
  }
  panel.hidden = true;
  map.setView([site(f).lat, site(f).lng], 16, { animate: false });
  markers.get(f).openPopup();
}

// パネルを閉じたら、条件に当てはまる施設が収まるように地図を動かす
function closePanel() {
  panel.hidden = true;
  const shown = [...markers.keys()];
  if (filterCount() && shown.length) {
    map.fitBounds(L.latLngBounds(shown.map(f => [site(f).lat, site(f).lng])), {
      animate: false, maxZoom: 16, paddingTopLeft: [24, 130], paddingBottomRight: [24, 110],
    });
  }
}

let typing;
qInput.addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { query = qInput.value.trim(); render(); }, 150);
});
qInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = window.FACILITIES.find(matchesFilter);
    if (query && first) showFacility(first);
  }
});
document.getElementById("closePanel").onclick = closePanel;
document.getElementById("reset").onclick = () => {
  wardSel.clear();
  typeSel.clear();
  query = "";
  qInput.value = "";
  panel.querySelectorAll(".chips .chip").forEach(b => b.setAttribute("aria-pressed", "false"));
  render();
};
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

const ageBox = document.querySelector(".ages");
for (const a of AGES) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = `${a}歳`;
  b.setAttribute("aria-pressed", a === age);
  b.onclick = () => {
    age = a;
    ageBox.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", i === a));
    render();
  };
  ageBox.appendChild(b);
}
const openBtn = document.getElementById("onlyOpen");
openBtn.onclick = () => {
  onlyOpen = !onlyOpen;
  openBtn.setAttribute("aria-pressed", onlyOpen);
  render();
};
document.getElementById("openPanel").onclick = () => {
  panel.hidden = false;
  qInput.focus();
};
document.getElementById("locate").onclick = () => map.locate({ setView: true, maxZoom: 15 });
map.on("locationfound", e => L.circleMarker(e.latlng, { radius: 8, color: "#2563eb", fillOpacity: 0.8 }).addTo(map));

// 見出しの「何月入所分・いつ時点か」は、毎月の更新で data.js に書かれる
const info = window.DATA_INFO || {};
if (info.entry) {
  document.getElementById("dataInfo").textContent = `${info.entry}入所分（${info.asOf}時点）・試作`;
}

render();
// 最初の表示範囲。スマホなど狭い画面で市全体を出すと中心部のピンが重なるので、
// 中区の施設が収まる範囲から始める（広いところは縮小して見てもらう）
const isNarrow = window.matchMedia("(max-width: 700px)").matches;
const startArea = isNarrow
  ? window.FACILITIES.filter(f => f.ward === "中区")
  : window.FACILITIES;
// 右上のボタンと左下の凡例にピンが隠れないよう余白を取る。
// 画面の大きさが確定してから合わせる（読み込み直後は地図の大きさがまだ0のことがある）
function fitStart() {
  map.invalidateSize();
  map.fitBounds(L.latLngBounds(startArea.map(f => [f.lat, f.lng])), {
    animate: false,
    paddingTopLeft: [24, 130],
    paddingBottomRight: [24, 110],
  });
}
if (document.readyState === "complete") fitStart();
else window.addEventListener("load", fitStart);
</script>
</body>
</html>
