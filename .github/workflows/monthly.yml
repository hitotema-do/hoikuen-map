name: Monthly update

# 毎朝7時（日本時間）に起動し、毎月1〜8日だけ動く（手で動かしたときは日付に関係なく動く）。
# 市のページに新しい月のPDFが出ていれば scripts/update_monthly.py で地図を作り直す。
#   終了コード0（問題なし）なら main に上げて地図に反映する。
#   終了コード2（要確認）や途中で止まったときは反映せず、issue で知らせる。
# 8日になっても今月の分が出ていなければ issue で知らせる。
# 知らせの issue が開いている間は、同じ知らせを重ねて出さない。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: 月次更新
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: day
        run: |
          day=$(TZ=Asia/Tokyo date +%-d)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=$(TZ=Asia/Tokyo date +%Y-%m)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$day" -le 8 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "今日は更新を見に行く日ではない（毎月1〜8日だけ）"
          fi

      - uses: actions/checkout@v5
        if: steps.day.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.day.outputs.go == 'true'
        with:
          python-version: "3.12"

      - if: steps.day.outputs.go == 'true'
        run: pip install -r requirements.txt

      - id: update
        if: steps.day.outputs.go == 'true'
        run: |
          set +e
          python scripts/update_monthly.py 2>&1 | tee "$RUNNER_TEMP/summary.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 2 ]

      - name: Publish
        if: steps.update.outputs.code == '0'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "新しい月の分はまだ出ていない"; exit 0
          fi
          month=$(ls data/vacancy_*.csv | sort | tail -1 | sed 's/.*vacancy_\(.*\)\.csv/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web
          git commit -m "$month の空き状況に自動更新"
          git push
          # ロボットの push では公開の仕組み（pages.yml）が動かないので、ここで動かす
          gh workflow run pages.yml

      - id: open
        name: Check open notice
        if: always() && steps.day.outputs.go == 'true'
        run: |
          gh label create "$LABEL" --color FBCA04 --force
          if [ -n "$(gh issue list --label "$LABEL" --state open --json number --jq '.[].number')" ]; then
            echo "お知らせ済み（開いている issue あり）"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify check needed
        if: steps.update.outputs.code == '2' && steps.open.outputs.exists != 'true'
        run: |
          {
            echo "@${{ github.repository_owner }} 新しい月の空き状況PDFが出ましたが、確認で気になる点があったため、地図には反映していません（前の月のまま）。"
            echo
            echo "Claude に「保育園マップの連絡が来た」と伝えてください。対応が終わったらこの issue を閉じます。"
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
            echo
            echo "記録：$RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --label "$LABEL" --title "【保育園マップ】今月の更新で確認が必要です" --body-file "$RUNNER_TEMP/body.md"

      - name: Notify not released
        if: >-
          github.event_name == 'schedule' && steps.day.outputs.day == '8' &&
          steps.update.outputs.code == '0' && steps.open.outputs.exists != 'true'
        run: |
          if [ -f "data/vacancy_${{ steps.day.outputs.month }}.csv" ]; then exit 0; fi
          gh issue create --label "$LABEL" \
            --title "【保育園マップ】今月の空き状況がまだ出ていません" \
            --body "@${{ github.repository_owner }} 8日になっても、市のページに今月1日現在の空き状況PDFが見つかりません。市の発表が遅れているか、ページの作りが変わった可能性があります。地図は前の月のままです。

          Claude に「保育園マップの連絡が来た」と伝えてください。"

      - name: Notify failure
        if: failure() && steps.open.outputs.exists != 'true'
        run: |
          gh issue create --label "$LABEL" \
            --title "【保育園マップ】月次更新がうまく動きませんでした" \
            --body "@${{ github.repository_owner }} 月次更新が途中で止まりました。市のページの作りが変わったか、PDFが読めなかった可能性があります。地図は前の月のままです。

          記録：$RUN_URL

          Claude に「保育園マップの連絡が来た」と伝えてください。"

      # 60日間リポジトリに動きがないと GitHub が定期実行を止めるので、月1回「使っています」と合図する
      - name: Keep schedule alive
        if: always() && steps.day.outputs.day == '1'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monthly.yml/enable"
